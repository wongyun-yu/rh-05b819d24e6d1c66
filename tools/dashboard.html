<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Research Hub</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<script>try { var t = localStorage.getItem("rh-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* Layout: monotone — zinc neutrals, ink as the active colour, one indigo accent for focus and links; projects as a bento
   (project · recent updates · shared pages), a project as a numbered stage rail with page cards under each stage */
:root {
  --bg: #fafafa; --surface: #ffffff; --ink: #09090b; --ink-2: #27272a; --muted: #71717a; --faint: #a1a1aa; --line: #e4e4e7; --line-2: #d4d4d8;
  --hover: #f4f4f5; --accent: #3e63dd; --live: #16a34a; --live-bg: #dcfce7; --warn: #b45309;
  --shadow-1: 0 1px 2px rgba(0,0,0,.04); --shadow-2: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -16px rgba(0,0,0,.18);
  --f-body: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #09090b; --surface: #111113; --ink: #fafafa; --ink-2: #e4e4e7; --muted: #a1a1aa; --faint: #71717a; --line: #232326; --line-2: #3f3f46;
  --hover: #18181b; --accent: #8da4ff; --live: #4ade80; --live-bg: #052e16; --warn: #fbbf24;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #09090b; --surface: #111113; --ink: #fafafa; --ink-2: #e4e4e7; --muted: #a1a1aa; --faint: #71717a; --line: #232326; --line-2: #3f3f46;
  --hover: #18181b; --accent: #8da4ff; --live: #4ade80; --live-bg: #052e16; --warn: #fbbf24;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7); color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--muted); }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.topbar .in { max-width: 1120px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; text-decoration: none; letter-spacing: -0.015em; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.crumb { color: var(--faint); }
.crumb-p { color: var(--muted); font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: 500 13.5px var(--f-body); cursor: pointer; text-decoration: none; white-space: nowrap; transition: border-color .12s, background .12s; }
.btn:hover { border-color: var(--line-2); background: var(--hover); }
.btn.icon { width: 34px; padding: 0; justify-content: center; color: var(--muted); }
.btn.icon:hover { color: var(--ink); }
.btn.search { color: var(--muted); min-width: 220px; }
.btn.search kbd { margin-left: auto; font: 11px var(--f-mono); color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: var(--bg); }
.btn.ink { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ink:hover { opacity: .88; background: var(--ink); }
@media (max-width: 640px) { .btn.search { min-width: 0; } .btn.search .lbl, .btn.search kbd, .hide-sm { display: none; } }

.wrap { max-width: 1120px; margin: 0 auto; padding: 40px 16px 96px; display: grid; gap: 40px; }
.hero h1 { margin: 6px 0 0; font-size: clamp(36px, 6.4vw, 60px); line-height: 1.02; font-weight: 750; letter-spacing: -0.045em; }
.hero p { margin: 14px 0 0; color: var(--muted); max-width: 60ch; font-size: 15.5px; text-wrap: pretty; }

/* bento */
.bento { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-1); min-width: 0; }
.tile h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pcard { grid-column: span 2; display: grid; grid-template-rows: auto 1fr auto; gap: 26px; text-decoration: none; position: relative;
  transition: border-color .15s, box-shadow .15s, transform .15s; }
.pcard:hover { border-color: var(--line-2); box-shadow: var(--shadow-2); }
.pcard:active { transform: translateY(1px); }
.pcard .tag { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.pcard h2 { margin: 14px 0 0; font-size: clamp(22px, 3vw, 30px); line-height: 1.18; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
.pcard .psub { margin: 10px 0 0; color: var(--muted); font-size: 14.5px; max-width: 56ch; }
.go { position: absolute; top: 20px; right: 20px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); transition: all .15s; }
.pcard:hover .go { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; align-self: end; }
.rail .seg { display: grid; gap: 8px; min-width: 0; align-content: start; }
.rail .seg i { height: 6px; border-radius: 3px; background: var(--line); }
.rail .seg.on i { background: var(--ink); }
.rail .seg span { font-size: 13px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail .seg.on span { color: var(--ink-2); font-weight: 500; }
.pmeta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.pmeta b { color: var(--ink); font-weight: 600; }
ul.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul.feed a { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; text-decoration: none; }
ul.feed a:hover { background: var(--hover); }
ul.feed .t { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ul.feed .t small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
ul.feed .ago { font: 12px var(--f-mono); color: var(--faint); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dot.live { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 22%, transparent); }
/* (no endless pulse: two pulsing dots kept the idle hub at 13–21 % of a CPU core — 10-16 사용자 "켜 놓으면 렉") */
.empty { color: var(--faint); font-size: 13px; padding: 4px 0; }
.dot.new { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.newchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.newchip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.tile h3 .lnk { border: 0; background: none; padding: 0; font: 500 12.5px var(--f-body); color: var(--muted); cursor: pointer; }
.tile h3 .lnk:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.tile h3 .cnt-new { color: var(--accent); font-weight: 600; }
.pmeta .nw { color: var(--accent); font-weight: 600; }
.step .nd { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
.tile.recent { grid-column: 3; grid-row: 1 / span var(--np, 2); }   /* beside every board card (--np = number of boards) */
.tile.shared { grid-column: span 2; }
@media (max-width: 860px) { .bento { grid-template-columns: 1fr 1fr; } .pcard, .tile.shared { grid-column: span 2; } .tile.recent { grid-column: auto; grid-row: auto; } }
@media (max-width: 560px) { .bento { grid-template-columns: 1fr; } .pcard, .tile.shared, .tile.recent { grid-column: auto; } .rail .seg span { display: none; } }

/* project view */
.phead { display: grid; gap: 10px; }
.phead h1 { margin: 0; font-size: clamp(28px, 4.6vw, 44px); line-height: 1.08; font-weight: 750; letter-spacing: -0.04em; text-wrap: balance; }
.phead p { margin: 0; color: var(--muted); max-width: 64ch; }
.stepper { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow-1); }
.step { display: grid; gap: 4px; padding: 14px 14px 12px; text-decoration: none; border-right: 1px solid var(--line); position: relative; min-width: 0; transition: background .12s; }
.step:last-child { border-right: 0; }
.step:hover { background: var(--hover); }
.step .n { font: 500 11.5px var(--f-mono); color: var(--faint); }
.step .nm { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .ct { font-size: 13px; color: var(--muted); }
.step.vac .nm { color: var(--faint); font-weight: 500; }
.step.has::after { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 2px; background: var(--ink); border-radius: 0 0 2px 2px; }
@media (max-width: 760px) { .stepper { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); } .step { border-bottom: 1px solid var(--line); } .step:nth-child(2n) { border-right: 0; } }
.stage { display: grid; gap: 14px; }
.stage-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.stage-h .no { font: 500 12px var(--f-mono); color: var(--faint); }
.stage-h h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.025em; }
.stage-h .hint { color: var(--muted); font-size: 13.5px; }
.stage.vacant .stage-h h2 { color: var(--faint); font-weight: 600; }
.stage.vacant { gap: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.card { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 18px; border-radius: 14px; background: var(--surface);
  border: 1px solid var(--line); box-shadow: var(--shadow-1); min-width: 0; transition: border-color .15s, box-shadow .15s, transform .15s; }
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow-2); }
.card:active { transform: translateY(1px); }
@media (prefers-reduced-motion: reduce) { .card, .pcard { transition: none; } .card:active, .pcard:active { transform: none; } }
.card .top { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.card .top .mini { margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--hover); white-space: nowrap; }
.chip.live { color: var(--live); background: var(--live-bg); }
.chip.sh { color: var(--ink); background: none; border: 1px solid var(--line); }
.card h3 { margin: 0; font-size: 16.5px; line-height: 1.35; font-weight: 650; letter-spacing: -0.015em; text-wrap: balance; }
.card-link { text-decoration: none; }
.card-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.card-link:focus-visible { outline: none; }
.card-link:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
.card p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; text-wrap: pretty; }
.card .foot { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.card .foot .when b { color: var(--ink-2); font-weight: 500; }
.card .foot .sp { flex: 1; }
.mini { position: relative; z-index: 1; height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font: 500 12.5px var(--f-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.mini:hover { color: var(--ink); border-color: var(--line-2); }
details.arch { position: relative; z-index: 2; }
details.arch summary { list-style: none; }
details.arch summary::-webkit-details-marker { display: none; }
details.arch .menu { position: absolute; right: 0; bottom: calc(100% + 6px); width: 220px; max-height: 240px; overflow: auto; padding: 6px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-2); }
details.arch .menu a { display: block; padding: 6px 8px; border-radius: 6px; font: 12.5px var(--f-mono); text-decoration: none; color: var(--ink-2); }
details.arch .menu a:hover { background: var(--hover); }
.phead .pact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.card.pend { border-style: dashed; box-shadow: none; background: transparent; }
.card.pend h3 { color: var(--ink-2); }
.chip.wait { color: var(--warn, #b45309); background: color-mix(in srgb, #f59e0b 14%, transparent); }
.card .foot .acts { margin-left: auto; display: flex; gap: 6px; }
.mini.danger:hover { color: #dc2626; }
.ren { position: relative; z-index: 1; display: inline-grid; place-items: center; width: 26px; height: 26px; margin-left: 6px; vertical-align: middle; border: 0; border-radius: 7px;
  background: none; color: var(--faint); cursor: pointer; opacity: 0; transition: opacity .12s, background .12s, color .12s; }
.ren svg { width: 14px; height: 14px; }
h1 .ren, h2 .ren { transform: translateY(-2px); }
.card .top .ren { margin-left: 0; }
.phead:hover .ren, .stage-h:hover .ren, .card:hover .ren, .ren:focus-visible { opacity: 1; }
.ren:hover { background: var(--hover); color: var(--ink); }
@media (hover: none) { .ren { opacity: .7; } }
.tile.newb { grid-column: 3; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; border-style: dashed; box-shadow: none;
  background: transparent; color: var(--muted); cursor: pointer; font: inherit; min-height: 120px; transition: border-color .15s, color .15s, background .15s; }
.tile.newb:hover { border-color: var(--line-2); color: var(--ink); background: var(--surface); }
.tile.newb b { font-size: 14.5px; font-weight: 650; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.tile.newb span { font-size: 13px; }
.pcard.wait { border-style: dashed; box-shadow: none; }
.pcard .tag.wait { color: var(--warn, #b45309); border-color: color-mix(in srgb, #f59e0b 40%, transparent); }
.pcard .rail.none { font-size: 13px; color: var(--faint); }
.pnote { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); padding: 10px 14px; border: 1px dashed var(--line-2); border-radius: 12px; }
.nosec { display: grid; justify-items: start; gap: 12px; padding: 28px; border: 1px dashed var(--line-2); border-radius: 14px; color: var(--muted); font-size: 14px; }
.nosec b { color: var(--ink); font-size: 16px; }
@media (max-width: 860px) { .bento { grid-auto-flow: row dense; } .tile.newb { grid-column: auto; } }
@media (max-width: 560px) { .tile.newb { grid-column: auto; } }
.dropov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); pointer-events: none; }
.dropov .box { display: grid; justify-items: center; gap: 6px; padding: 36px 44px; border: 2px dashed var(--accent); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-2); text-align: center; }
.dropov .box b { font-size: 17px; letter-spacing: -0.02em; }
.dropov .box span { color: var(--muted); font-size: 13.5px; }
footer { color: var(--faint); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
.view-in { animation: vin .22s ease-out; }
@keyframes vin { from { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { .view-in { animation: none; } }
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="#"><span class="logo"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5 17 10 9l5 5 4-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="hide-sm">Research Hub</span></a>
  <span class="crumb" id="crumb-sl" hidden>/</span><span class="crumb-p" id="crumb-p" hidden></span>
  <span class="sp"></span>
  <button class="btn search" id="find" type="button" aria-label="검색 (Ctrl+K)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">페이지 검색</span><kbd id="kbd">Ctrl K</kbd></button>
  <button class="btn icon" id="theme" type="button" aria-label="테마 바꾸기"></button>
  <button class="btn" id="lock" type="button"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="hide-sm">잠그기</span></button>
</div></header>
<div class="wrap">
  <section id="home" aria-label="판">
    <div class="hero">
      <div class="eyebrow">Wongyun Yu · 진행 중인 연구</div>
      <h1>Research Hub</h1>
      <p>판을 누르면 섹션별 페이지가 나옵니다. 판마다 섹션을 따로 정하고, 받은 HTML은 판 화면에 끌어다 놓으면 올라갑니다.</p>
    </div>
    <div class="bento" id="bento" style="margin-top:32px"></div>
  </section>
  <section id="project" aria-live="polite" hidden></section>
  <div class="dropov" id="dropov" hidden><div class="box"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><b id="dropov-t">놓으면 올리기 창이 열립니다</b><span id="dropov-s">HTML 파일</span></div></div>
  <footer>
    <span>모든 페이지는 브라우저 안에서만 풀립니다</span>
    <span class="mono" id="foot"></span>
  </footer>
</div>
<script type="application/json" id="hub-data">{{DATA}}</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("hub-data").textContent);
  var R = window.__rh || {};
  // sections belong to a board (판): D.stages = [{key, label, hint, project, own}] (manifest rows + hub_boards.tsv)
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
  function fmtSize(b) { if (!b) return ""; if (b > 1e6) return (b / 1e6).toFixed(1) + " MB"; return Math.max(1, Math.round(b / 1e3)) + " KB"; }
  function mins(iso) { return iso ? (Date.now() - new Date(iso).getTime()) / 60000 : Infinity; }
  function ago(iso) {
    if (!iso) return ""; var d = mins(iso);
    if (d < 1) return "방금"; if (d < 60) return Math.round(d) + "분 전"; if (d < 1440) return Math.round(d / 60) + "시간 전";

      var changed = false;
      D.items.forEach(function (it) {
        var e = r.st.pages[it.pdir]; if (!e) return;
        var nw = {mode: e.mode || "private", n: (e.invites || []).length};
        if (!it.share || nw.mode !== it.share.mode || nw.n !== it.share.n) { it.share = nw; changed = true; }
      });
      if (changed) { var y = window.scrollY; draw(); window.scrollTo(0, y); }
    }).catch(function () {});
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-share]"); if (!b) return;
    e.preventDefault();
    var it = D.items.filter(function (x) { return x.pdir === b.getAttribute("data-share"); })[0];
    withUI(function (U) { U.share({pdir: it.pdir, title: it.title}); });
  });
  document.addEventListener("click", function (e) { if (e.target.closest("[data-seen-all]")) markAllSeen(); });
  // ---- uploads ----------------------------------------------------------------------------------------------------
  function curProject() { var m = /^#p-(.+)$/.exec(location.hash); return m && byProj[decodeURIComponent(m[1])] ? decodeURIComponent(m[1]) : ""; }
  function openUpload(extra) {
    withUI(function (U) {
      var pl = projList().filter(function (p) { return p.wait !== "del"; }), by = {};
      pl.forEach(function (p) { by[p.id] = stagesOf(p.id).map(function (s) { return {key: s[0], label: s[1]}; }); });
      U.upload(Object.assign({projects: pl.map(function (p) { return {id: p.id, name: p.name}; }), stagesBy: by,
                              project: curProject() || (pl[0] || {}).id}, extra || {}));
    });
  }
  function refreshPending() {
    withUI(function (U) {
      if (!U.pending) return;
      U.pending().then(async function (r) {
        if ((r.gone || []).length) mergeCloud(await U.cloud(true));   // left the inbox = live (or refused) → the new list
        (r.gone || []).forEach(function (x) {
          var bad = (D.rej || []).filter(function (j) { return j.id === x.id; })[0];
          if (bad) U.toast(x.op === "board" ? "‘" + x.title + "’ 판 변경을 반영하지 못했습니다: " + bad.why : x.op === "names" ? "이름을 바꾸지 못했습니다: " + bad.why : "‘" + x.title + "’을 올리지 못했습니다: " + bad.why);
        });
        PEND = r; mergeCloud(); redraw();
        if (r.items.length) { clearTimeout(pendT); pendT = setTimeout(refreshPending, 15000); }   // keep watching while something waits
      }).catch(function () {});
    });
  }
  var pendT = 0;
  window.addEventListener("rh-inbox", refreshPending);
  refreshPending();
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-upload],[data-upv],[data-updel],[data-upcancel]"); if (!b) return;
    e.preventDefault();
    var it = D.items.filter(function (x) { return x.pdir === (b.getAttribute("data-upv") || b.getAttribute("data-updel")); })[0];
    if (b.hasAttribute("data-upload")) openUpload();
    else if (b.hasAttribute("data-upv") && it) openUpload({replace: {project: it.project, category: it.category, slug: it.slug, title: it.title}});
    else if (b.hasAttribute("data-updel") && it) {
      if (b.getAttribute("data-armed") !== "1") {   // two-step confirm without a blocking dialog
        b.setAttribute("data-armed", "1"); b.textContent = "정말 내리기"; setTimeout(function () { if (b.isConnected) { b.removeAttribute("data-armed"); b.textContent = "내리기"; } }, 2500); return;
      }
      b.disabled = true;
      withUI(function (U) { U.unlist({project: it.project, category: it.category, slug: it.slug, title: it.title}).then(function () { b.disabled = false; }); });
    } else if (b.hasAttribute("data-upcancel")) {
      b.disabled = true;
      withUI(function (U) { U.cancelUpload(b.getAttribute("data-upcancel")).then(function (ok) { U.toast(ok ? "취소했습니다" : "취소하지 못했습니다 · 이미 반영 중일 수 있습니다"); }); });
    }
  });
  // renames: the pencil next to a board / section / page title (rh-ui rename → names op → the cloud step's map)
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-ren]"); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var k = b.getAttribute("data-ren"), kind = k[0], rest = k.slice(2), f;
    if (kind === "b") { var p = byProj[rest]; f = {key: k, label: "판 이름", cur: p.name, orig: p.own ? null : p.oname, group: "판"}; }
    else if (kind === "s") { var pj = rest.split("/")[0], sk = rest.slice(pj.length + 1), st = D.stages.filter(function (x) { return x.project === pj && x.key === sk; })[0] || {};
      var ps = stagesOf(pj).filter(function (x) { return x[0] === sk; })[0] || [];
      f = {key: k, label: "섹션 이름", cur: ps[1] || st.label || sk, orig: st.own || !st.key ? null : st.olabel, group: "섹션"}; }
    else { var it = D.items.filter(function (x) { return x.project + "/" + x.category + "/" + x.slug === rest; })[0];
      f = {key: k, label: "페이지 제목", cur: it.title, orig: it.kind === "upload" ? null : it.otitle, group: "페이지"};
      f.note = 1; }
    withUI(function (U) { U.rename({title: f.cur, fields: [f]}); });
  });
  window.addEventListener("rh-names", function () { refreshPending(); });
  // boards (판): new · edit sections — rh-ui.js sends op board to the inbox; the view follows from PEND at once
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-board]"); if (!b) return;
    e.preventDefault();
    var pid = b.getAttribute("data-board"), p = byProj[pid];
    withUI(function (U) {
      if (pid === "new" || !p) return U.board({ids: projList().map(function (x) { return x.id; })});
      var used = {};
      itemsOf(pid).forEach(function (it) { used[it.category] = (used[it.category] || 0) + 1; });
      PEND.items.forEach(function (x) { if (x.op === "add" && x.project === pid) used[x.category] = (used[x.category] || 0) + 1; });
      var SG = stagesOf(pid);
      U.board({project: {id: pid, name: p.name, own: !!p.own, pages: itemsOf(pid).length},
               fixed: SG.filter(function (s) { return !s[3]; }).map(function (s) { return {key: s[0], label: s[1], n: used[s[0]] || 0}; }),
               stages: SG.filter(function (s) { return s[3]; }).map(function (s) { return {key: s[0], label: s[1], n: used[s[0]] || 0}; })});
    });
  });
  window.addEventListener("rh-board", function (e) {   // after a send: go to the new board / leave a board being removed
    var d = e.detail || {};
    if (d.del) { if (curProject() === d.project) location.hash = ""; }
    else if (d.new) location.hash = "#p-" + encodeURIComponent(d.project);
  });
  // drag files from the desktop onto the hub → the upload dialog, section = the one under the pointer
  var dragN = 0;
  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0; }
  function dlgOpen() { var u = document.getElementById("rh-ui"); return !!(u && u.shadowRoot && u.shadowRoot.querySelector(".ov")); }
  function dropTarget(e) {
    var sec = e.target && e.target.closest && e.target.closest("section.stage[data-cat]"), pid = curProject();
    var card = !pid && e.target && e.target.closest && e.target.closest("a.pcard[href^='#p-']");   // home: the project card under the pointer
    if (card) pid = decodeURIComponent(card.getAttribute("href").slice(3));
    var cat = sec ? sec.getAttribute("data-cat") : "";
    return {pid: pid, cat: cat};
  }
  document.addEventListener("dragenter", function (e) { if (!hasFiles(e) || dlgOpen()) return; dragN++; $("dropov").hidden = false; });
  document.addEventListener("dragleave", function () { if (--dragN <= 0) { dragN = 0; $("dropov").hidden = true; } });
  document.addEventListener("dragover", function (e) {
    if (!hasFiles(e) || dlgOpen()) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "copy";
    var t = dropTarget(e), p = byProj[t.pid];
    $("dropov-t").textContent = p ? "놓으면 ‘" + String(p.name).split(" · ")[0] + "’에 올립니다" : "판 카드 위에 놓으면 그 판으로 올립니다";
    $("dropov-s").textContent = t.cat ? "섹션: " + stageLabel(t.pid, t.cat) : "HTML 파일 · 제목과 섹션은 다음 창에서 고릅니다";
  });
  document.addEventListener("drop", function (e) {
    dragN = 0; $("dropov").hidden = true;
    if (!hasFiles(e) || dlgOpen()) return;
    e.preventDefault();
    var t = dropTarget(e), files = Array.prototype.slice.call(e.dataTransfer.files);
    openUpload({files: files, category: t.cat || "", project: t.pid || curProject() || (projList()[0] || {}).id});
  });
  window.addEventListener("pageshow", function (e) {   // back from a page (bfcache) → pick up what was just opened
    if (!e.persisted) return;
    try { SEEN = JSON.parse(localStorage.getItem("rh-seen") || "null") || SEEN; } catch (x) {}
    var y = window.scrollY; draw(); window.scrollTo(0, y);
  });
  $("find").addEventListener("click", function () { withUI(function (U) { U.palette(); }); });
  $("kbd").textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘K" : "Ctrl K";
  function isDark() { var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
  function themeIcon() {   // shows what a click switches to
    $("theme").innerHTML = isDark() ? IC.sun : IC.moon;
    $("theme").setAttribute("aria-label", isDark() ? "밝은 화면으로" : "어두운 화면으로"); $("theme").title = $("theme").getAttribute("aria-label");
  }
  $("theme").addEventListener("click", function () {
    var nx = isDark() ? "light" : "dark";
    try { localStorage.setItem("rh-theme", nx); } catch (e) {}
    document.documentElement.setAttribute("data-theme", nx); themeIcon();
    window.dispatchEvent(new CustomEvent("rh-theme", {detail: nx}));
  });
  window.addEventListener("rh-theme", themeIcon);
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeIcon); } catch (e) {}
  themeIcon();
  window.addEventListener("hashchange", route);
  $("foot").textContent = "페이지 " + D.items.length + " · 빌드 " + stamp(D.built);
  var m0 = /^#p-(.+)$/.exec(location.hash);   // a board known only from u.enc: wait for it (at most 2 s) instead of flashing home
  $("lock").addEventListener("click", function () {
    if (typeof window.__rhLock === "function") return window.__rhLock();
    try { sessionStorage.removeItem("rh-key"); localStorage.removeItem("rh-key"); } catch (e) {}
    location.reload();
  });
  if (!m0 || D.projects.some(function (p) { return p.id === decodeURIComponent(m0[1]); })) { route(); }
  setTimeout(function () { if (!cloudDone) { cloudDone = true; route(); } }, 2000);
})();
</script>
</body>
</html>
