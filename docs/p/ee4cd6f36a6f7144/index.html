<style>
/* Lock screen — monotone: zinc neutrals, ink-filled primary button, one indigo accent for focus only */
:root {
  --bg: #fafafa; --surface: #ffffff; --ink: #09090b; --muted: #71717a; --faint: #a1a1aa; --line: #e4e4e7; --line-2: #d4d4d8;
  --hover: #f4f4f5; --accent: #3e63dd; --ring: rgba(62, 99, 221, .28); --bad: #dc2626; --dot: #d4d4d8;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
  --f-body: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #09090b; --surface: #111113; --ink: #fafafa; --muted: #a1a1aa; --faint: #71717a; --line: #27272a; --line-2: #3f3f46;
  --hover: #18181b; --accent: #8da4ff; --ring: rgba(141, 164, 255, .3); --bad: #f87171; --dot: #27272a;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #09090b; --surface: #111113; --ink: #fafafa; --muted: #a1a1aa; --faint: #71717a; --line: #27272a; --line-2: #3f3f46;
  --hover: #18181b; --accent: #8da4ff; --ring: rgba(141, 164, 255, .3); --bad: #f87171; --dot: #27272a;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased;
  display: grid; place-items: center; padding: 24px 16px; letter-spacing: -0.005em; word-break: keep-all; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 0%, transparent 75%); mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 0%, transparent 75%); }
[hidden] { display: none !important; }
.lock { width: min(380px, 100%); display: grid; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 14px; letter-spacing: -0.01em; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); display: grid; gap: 18px; }
h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
p.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
form { display: grid; gap: 12px; }
label.f { font-size: 13px; font-weight: 550; color: var(--ink); }
.field { position: relative; }
.field input { width: 100%; height: 42px; padding: 0 44px 0 12px; border: 1px solid var(--line-2); border-radius: 9px;
  background: var(--surface); color: var(--ink); font: 500 15px var(--f-body); transition: border-color .15s, box-shadow .15s; }
.field input.code { font: 500 16px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
.field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
.eye { position: absolute; right: 4px; top: 4px; width: 34px; height: 34px; border: 0; border-radius: 7px; background: none; color: var(--faint);
  display: grid; place-items: center; cursor: pointer; }
.eye:hover { color: var(--ink); background: var(--hover); }
.hint { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); }
.remember { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
.remember input { width: 15px; height: 15px; accent-color: var(--ink); margin: 0; }
button.primary { height: 42px; border: 0; border-radius: 9px; background: var(--ink); color: var(--bg); font: 600 14.5px var(--f-body);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .15s; }
button.primary:hover { opacity: .88; }
button.primary:disabled { opacity: .6; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.msg { margin: 0; font-size: 13px; color: var(--bad); }
.msg:empty { display: none; }
.alt { border: 0; background: none; color: var(--muted); font: 500 13px var(--f-body); cursor: pointer; padding: 0; justify-self: start; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.alt:hover { color: var(--ink); }
.fine { margin: 0; text-align: center; font: 11.5px var(--f-mono); color: var(--faint); letter-spacing: 0.01em; }
.loading { display: grid; justify-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
.loading .logo { width: 36px; height: 36px; border-radius: 10px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .spin, .loading .logo { animation: none; } }
</style>

<script>
(function () {
  "use strict";

  var ROOT = new URL(C.root, location.href);
  var SK = "rh-key", PK = "rh-pk", enc = new TextEncoder();
  function $(id) { return document.getElementById(id); }
  function b64d(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(u) { var s = ""; for (var i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
  // ---- stored keys: owner K = rh-key {kid, k} (session; local when remembered) · shared page keys = rh-pk {pdir: k}
  function getStored() {
    var out = null;
    [sessionStorage, localStorage].forEach(function (st) {
      if (out) return;
      try { var v = JSON.parse(st.getItem(SK) || "null"); if (v && v.k && (v.kid === C.kid || (!v.kid && v.salt))) out = v.k; } catch (e) {}
    });
    return out;
  }
  function putStored(k, remember) {
    var v = JSON.stringify({kid: C.kid, k: k});
    try { sessionStorage.setItem(SK, v); } catch (e) {}
    try { if (remember) localStorage.setItem(SK, v); else localStorage.removeItem(SK); } catch (e) {}
  }
  function pkMap(st) { try { return JSON.parse(st.getItem(PK) || "{}") || {}; } catch (e) { return {}; } }
  function getPage() { return (C.p && (pkMap(sessionStorage)[C.p] || pkMap(localStorage)[C.p])) || null; }
  function putPage(k, remember) {
    [[sessionStorage, true], [localStorage, remember]].forEach(function (x) {
      try { var m = pkMap(x[0]); if (x[1]) m[C.p] = k; else delete m[C.p]; x[0].setItem(PK, JSON.stringify(m)); } catch (e) {}
    });
  }
  function dropPage() { [sessionStorage, localStorage].forEach(function (st) { try { var m = pkMap(st); delete m[C.p]; st.setItem(PK, JSON.stringify(m)); } catch (e) {} }); }
  function clearStored() { [sessionStorage, localStorage].forEach(function (st) { try { st.removeItem(SK); st.removeItem(PK); } catch (e) {} }); }
  function idbOp(fn) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("rh", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("k"); };
      r.onerror = function () { rej(r.error); };
      r.onsuccess = function () {
        var t = r.result.transaction("k", "readwrite"), s = t.objectStore("k"), out = {};
        fn(s, out); t.oncomplete = function () { res(out.v); }; t.onerror = function () { rej(t.error); };
      };
    });
  }
  // ---- crypto (the build derives the same: hub_build.hk · invite_slot)
  var HUBCFG = null;
  async function hubCfg() {
    if (HUBCFG) return HUBCFG;
    var r = await fetch(new URL("hub.json", ROOT).href, {cache: "no-cache"});
    HUBCFG = await r.json();
    return HUBCFG;
  }
  async function hkdf(raw, info) {
    var base = await crypto.subtle.importKey("raw", raw, "HKDF", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name: "HKDF", hash: "SHA-256", salt: enc.encode("rh"), info: enc.encode(info)}, base, 256));
  }
  async function pbkdf(secret, salt, iter) {
    var base = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: enc.encode(salt), iterations: iter}, base, 256));
  }
  async function openSealed(raw, b) {
    var k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: b.subarray(0, 12)}, k, b.subarray(12)));
  }
  async function ownerFromPassword(pw) {   // envelope: the password derives a wrapping key that opens K (hub.json "w")
    var h = await hubCfg();
    var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
    var kek = new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64d(h.salt), iterations: h.iter}, base, 256));
    return await openSealed(kek, b64d(h.w));
  }
  // an uploaded page (cfg ku) is keyed from K_u = HKDF(K, "uploads") — the cloud step (GitHub Actions) holds K_u, never K
  async function baseKey(K) { return C.ku ? await hkdf(K, "uploads") : K; }
  async function payloadKey(K) {   // owner: the hub opens with K itself · a page with its own key · an archive with the owner-only key
    if (!C.p) return K;
    return await hkdf(await baseKey(K), C.own ? "arch:" + C.p : "page:" + C.p + "#" + (C.e || 0));
  }
  // an uploaded page (cfg b): its file is a separate sealed body.enc — opened straight into a Blob (never a string),
  // which the host page's frame loads by URL. Revalidated like the page (Pages caches 10 min); a stale copy that will
  // not open with this page's key is fetched once more past the cache.
  async function upBody(raw) {
    for (var i = 0; i < 2; i++) {
      var r = await fetch(new URL(C.b, location.href).href, {cache: i ? "reload" : "no-cache"});
      if (!r.ok) throw new Error("body " + r.status);
      var pt;
      try { pt = await openSealed(raw, new Uint8Array(await r.arrayBuffer())); } catch (e) { if (i) throw e; continue; }
      var b = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).blob();
      return new Blob([b], {type: "text/html;charset=utf-8"});
    }
  }
  async function decrypt(raw) {
    var pt = await openSealed(raw, b64d(PAY));
    if (!C.z) return new TextDecoder().decode(pt);
    return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  function normCode(s) { return String(s).toUpperCase().replace(/[^0-9A-Z]/g, ""); }
  async function fromInvite(id, code, fragSlot) {
    var kek = await pbkdf(normCode(code), "rh-inv:" + C.p + ":" + id, 310000);
    var tries = [];
    if (C.sl && C.sl[id]) tries.push(C.sl[id]);
    if (fragSlot) tries.push(fragSlot);
    for (var i = 0; i < tries.length; i++) {
      try { var kp = await openSealed(kek, b64d(tries[i])); return [kp, await decrypt(kp)]; } catch (e) {}
    }
    throw new Error("code");
  }
  // ---- service worker: owner → K (derives every page key) · viewer → this page's key only
  async function armWorker(msg, raw) {
    if (!C.assets || !("serviceWorker" in navigator)) return;
    try {
      await idbOp(function (s, out) {
        if (msg === "owner") s.put(raw, "key");
        else { var g = s.get("pages"); g.onsuccess = function () { var m = g.result || {}; m[C.p] = raw; s.put(m, "pages"); }; }
      });

      var w = reg.installing || reg.waiting;
      if (w) await new Promise(function (r) { w.addEventListener("statechange", function () { if (w.state === "activated" || w.state === "redundant") r(); }); setTimeout(r, 6000); });
      var act = reg.active;
      if (act) await new Promise(function (r) {
        var ch = new MessageChannel(); ch.port1.onmessage = function () { r(); }; setTimeout(r, 1500);
        act.postMessage(msg === "owner" ? {type: "owner", raw: raw} : {type: "page", pdir: C.p, raw: raw}, [ch.port2]);
      });

        await new Promise(function (r) { navigator.serviceWorker.addEventListener("controllerchange", r, {once: true}); setTimeout(r, 5000); });
      }

  }
  function lockAll() {
    clearStored();
    idbOp(function (s) { s.delete("key"); s.delete("pages"); }).catch(function () {});
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({type: "lock"});
  }
  window.__rhLock = function () { lockAll(); setTimeout(function () { location.href = ROOT.href; }, 150); };
  // Owner: the page bar gets the full data (other pages' titles), sealed with HKDF(K, "meta") in cfg.n
  async function withNav(html, K) {
    if (!K || !C.n) return html;
    try {
      var full = new TextDecoder().decode(await openSealed(await hkdf(await baseKey(K), "meta"), b64d(C.n))).replace(/<\//g, "<\\/");
      return html.replace(/(<script type="application\/json" id="rh-nav-data">)[\s\S]*?(<\/script>)/, function (m, a, b) { return a + full + b; });
    } catch (e) { return html; }
  }
  function render(html, role, K, kp) {
    window.__rh = {role: role, pdir: C.p || "", epoch: C.e || 0, own: !!C.own, kind: C.kind, root: ROOT.href, kid: C.kid,
                   owner: K ? b64e(K) : "", lock: window.__rhLock};
    if (C.b) { window.__rhUp = upBody(kp); window.__rhUp.catch(function () {}); }
    PAY = null;   // the sealed page is not needed once shown (this closure lives on — keep it from holding the copy)
    document.open(); document.write(html); document.close();
  }
  function stripFrag() { try { history.replaceState(history.state, "", location.pathname + location.search); } catch (e) {} }
  // ---- fragment: #k=<page key> (share link) · #i=<id>.<slot> (invite — the code is asked here)

  (function () {
    var h = location.hash.slice(1), m;
    if ((m = /^k=([A-Za-z0-9_-]{40,})$/.exec(h))) FR.k = m[1];

  })();
  var loadT = setTimeout(function () { $("rh-loading").hidden = false; }, 250);
  function showLock(mode, note) {
    clearTimeout(loadT); $("rh-loading").hidden = true;
    var L = $("rh-lock"); L.hidden = false;
    var pw = $("rh-pw"), msg = $("rh-msg"), alt = $("rh-alt"), invite = mode === "invite";
    $("rh-title").textContent = invite ? "초대받은 페이지" : "잠겨 있습니다";
    $("rh-sub").textContent = invite ? "받은 접속 코드를 넣으세요. 이 브라우저 안에서만 풀립니다."

    $("rh-label").textContent = invite ? "접속 코드" : "비밀번호";
    pw.type = invite ? "text" : "password"; pw.className = invite ? "code" : ""; pw.value = "";
    pw.placeholder = invite ? "XXXX-XXXX-XXXX" : ""; pw.autocomplete = invite ? "one-time-code" : "current-password";
    $("rh-eye").hidden = invite;
    msg.textContent = note || "";
    if (FR.i && C.p) { alt.hidden = false; alt.textContent = invite ? "소유자 비밀번호로 열기" : "접속 코드로 열기"; alt.onclick = function () { showLock(invite ? "owner" : "invite"); }; }

      ev.preventDefault();
      var btn = $("rh-go");
      btn.disabled = true; msg.textContent = ""; $("rh-go-t").textContent = "확인 중…";
      if (!window.crypto || !crypto.subtle) { msg.textContent = "이 브라우저는 암호 풀기를 지원하지 않습니다(https 로 열었는지 확인)."; btn.disabled = false; $("rh-go-t").textContent = "열기"; return; }

      try {
        if (invite) {
          var got = await fromInvite(FR.i, pw.value, FR.slot), kp = got[0], html = got[1];
          putPage(b64e(kp), remember); stripFrag();
          await armWorker("page", kp); render(html, "invite", null, kp);
        } else {
          var K = await ownerFromPassword(pw.value), pk2 = await payloadKey(K);
          var html2 = await decrypt(pk2);
          putStored(b64e(K), remember); stripFrag();
          await armWorker("owner", K); render(await withNav(html2, K), "owner", K, pk2);
        }
      } catch (e) {
        msg.textContent = invite ? "접속 코드가 맞지 않거나 접근 권한이 회수됐습니다." : "비밀번호가 맞지 않습니다. 다시 넣어 주세요.";
        btn.disabled = false; $("rh-go-t").textContent = "열기"; pw.select();
      }
    };
  }
  $("rh-eye").addEventListener("click", function () {
    var pw = $("rh-pw"), on = pw.type === "password"; pw.type = on ? "text" : "password"; this.setAttribute("aria-pressed", String(on)); pw.focus();
  });
  $("rh-pw").addEventListener("keyup", function (e) { if (e.getModifierState) $("rh-caps").hidden = !e.getModifierState("CapsLock") || this.type !== "password"; });
  // Network first: GitHub Pages serves HTML with max-age=600, so a cached copy can be up to 10 min old.
  // Revalidate this same URL (conditional request → 304 when unchanged) and use the newest payload/config.
  async function refresh() {
    try {
      var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 5000);
      var r = await fetch(location.pathname, {cache: "no-cache", signal: ctl.signal});
      clearTimeout(t);
      if (!r.ok) return;
      var txt = await r.text();
      var c = txt.match(/<script type="application\/json" id="rh-cfg">([\s\S]*?)<\/script>/);
      var m = txt.match(/<script type="text\/plain" id="rh-payload">([\s\S]*?)<\/script>/);
      if (c && m) { C = JSON.parse(c[1]); PAY = m[1].trim(); ROOT = new URL(C.root, location.href); }
    } catch (e) {}
  }
  (async function () {
    await refresh();
    var k = getStored();
    if (k) {   // owner (stored site key)
      try {
        var K = b64d(k), pk0 = await payloadKey(K), html0 = await decrypt(pk0);
        var rem = false; try { rem = !!localStorage.getItem(SK); } catch (e) {}
        putStored(k, rem);   // rewrite in the current {kid, k} form
        if (FR.k || FR.i) stripFrag();
        await armWorker("owner", K); render(await withNav(html0, K), "owner", K, pk0); return;
      } catch (e) { try { sessionStorage.removeItem(SK); localStorage.removeItem(SK); } catch (e2) {} }
    }
    if (C.p && !C.own && FR.k) {   // share link
      try {
        var kp = b64d(FR.k), html1 = await decrypt(kp);
        putPage(b64e(kp), false); stripFrag();
        await armWorker("page", kp); render(html1, "link", null, kp); return;
      } catch (e) { return showLock("owner", "이 링크는 더 이상 열리지 않습니다. 공유한 사람에게 새 링크를 받아 주세요."); }
    }
    var pk = !C.own && getPage();
    if (pk && !FR.i) {   // came back to a page opened earlier with a link / code
      try {
        var kq = b64d(pk), html2 = await decrypt(kq);
        await armWorker("page", kq); render(html2, "viewer", null, kq); return;
      } catch (e) { dropPage(); return showLock("owner", "접근 권한이 바뀌었습니다. 공유한 사람에게 새 링크를 받아 주세요."); }
    }
    showLock(FR.i && C.p ? "invite" : "owner");
  })();
})();
